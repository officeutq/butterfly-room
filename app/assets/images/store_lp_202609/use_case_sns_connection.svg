    <path d="M267 176h170" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    <path d="M410 151l35 25-35 25" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
