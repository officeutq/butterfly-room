  <rect x="62" y="545" width="836" height="120" rx="22" fill="#160b20" fill-opacity=".78"/>
  <text x="480" y="590" fill="#ffacd6" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="5" text-anchor="middle">DUMMY / SNS TO LIVE</text>
