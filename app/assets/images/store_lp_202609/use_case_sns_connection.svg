  <rect width="960" height="720" fill="url(#bg)"/>
  <g transform="translate(100 100)">
    <rect width="228" height="355" rx="30" fill="#fff" fill-opacity=".15" stroke="#fff" stroke-opacity=".5"/>
    <circle cx="58" cy="64" r="24" fill="#f4d9ed"/>
    <rect x="95" y="48" width="94" height="12" rx="6" fill="#fff" fill-opacity=".72"/>
