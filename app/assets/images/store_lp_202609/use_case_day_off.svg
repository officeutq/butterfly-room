  <rect width="960" height="720" fill="url(#bg)"/>
  <circle cx="720" cy="165" r="115" fill="#fff" fill-opacity=".12"/>
  <path d="M0 455c158-70 309-68 453 4 170 84 339 85 507 3v258H0z" fill="#160a24" fill-opacity=".56"/>
  <g transform="translate(155 108)">
    <rect x="78" y="82" width="430" height="330" rx="34" fill="#fff" fill-opacity=".11" stroke="#fff" stroke-opacity=".28"/>
    <circle cx="285" cy="175" r="70" fill="#f5d8eb"/>
