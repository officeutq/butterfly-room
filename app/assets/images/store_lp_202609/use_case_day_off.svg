  <rect x="62" y="545" width="836" height="120" rx="22" fill="#160b20" fill-opacity=".78"/>
  <text x="480" y="590" fill="#dcbcff" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="5" text-anchor="middle">DUMMY / DAY OFF</text>
  <text x="480" y="632" fill="#fff" font-family="sans-serif" font-size="25" font-weight="700" text-anchor="middle">店休日に落ち着いた場所から配信するキャスト</text>
