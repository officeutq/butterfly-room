<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">ヒーロー画像ダミー</title>
  <desc id="desc">店舗で働くキャストがスマートフォンで配信し、来店できないお客様とつながる写真へ差し替えるためのダミー画像</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b0a43"/>
      <stop offset="0.52" stop-color="#6f2aa5"/>
      <stop offset="1" stop-color="#e34c9d"/>
    </linearGradient>
    <radialGradient id="light" cx="70%" cy="20%" r="65%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="1500" fill="url(#bg)"/>
  <rect width="1200" height="1500" fill="url(#light)"/>
  <g fill="none" stroke="#fff" stroke-opacity=".2">
    <circle cx="600" cy="650" r="490"/>
    <circle cx="600" cy="650" r="390" stroke-dasharray="14 18"/>
  </g>
  <g transform="translate(250 270)">
    <circle cx="350" cy="245" r="148" fill="#f8d9ee"/>
    <path d="M205 256c20-160 268-196 310-20-22-10-46-15-70-15-70 0-112 32-154 83-29-12-58-28-86-48z" fill="#25102f"/>
    <path d="M214 505c34-120 114-182 236-182 121 0 203 62 236 182v310H214z" fill="#f2e5ff"/>
    <rect x="500" y="490" width="210" height="390" rx="38" fill="#1b1021" stroke="#fff" stroke-width="12"/>
    <rect x="520" y="530" width="170" height="286" rx="22" fill="#e34c9d"/>
    <circle cx="605" cy="848" r="14" fill="#fff" fill-opacity=".7"/>
    <circle cx="605" cy="650" r="58" fill="#fff" fill-opacity=".22"/>
    <path d="M585 616l58 34-58 34z" fill="#fff"/>
  </g>
  <g transform="translate(82 1040)">
    <rect width="1036" height="244" rx="36" fill="#160b20" fill-opacity=".72" stroke="#fff" stroke-opacity=".22"/>
    <text x="518" y="72" fill="#ff9dce" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="6" text-anchor="middle">DUMMY IMAGE</text>
    <text x="518" y="132" fill="#fff" font-family="sans-serif" font-size="32" font-weight="700" text-anchor="middle">キャストがスマートフォンで配信する写真</text>
    <text x="518" y="184" fill="#fff" fill-opacity=".72" font-family="sans-serif" font-size="23" text-anchor="middle">夜のお店らしい空間／明るい表情／縦位置</text>
  </g>
</svg>
